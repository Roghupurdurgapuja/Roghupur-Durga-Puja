<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Panel - রঘুপুর সার্বজনীন পূজা মন্ডপ</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,"Noto Sans Bengali",sans-serif;
    background:#f7f2f5;
    color:#351426;
}

#loginPage{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:linear-gradient(135deg,#5a1235,#8d2855);
}

.login-box{
    width:100%;
    max-width:420px;
    background:white;
    padding:32px 24px;
    border-radius:22px;
    box-shadow:0 15px 45px rgba(0,0,0,.25);
    text-align:center;
}

.login-icon{
    font-size:55px;
}

.login-box h1{
    margin:5px 0;
    color:#6b183f;
}

.login-box p{
    color:#777;
}

.login-box input{
    width:100%;
    padding:14px;
    border:1px solid #d8c6d0;
    border-radius:12px;
    font-size:16px;
    margin:8px 0 12px;
}

button{
    cursor:pointer;
}

.login-btn,
.save,
.logout{
    width:100%;
    border:0;
    padding:14px;
    border-radius:12px;
    font-size:16px;
    font-weight:bold;
}

.login-btn,
.save{
    background:#6b183f;
    color:white;
}

.logout{
    background:#b3261e;
    color:white;
    margin-top:15px;
}

.login-error{
    display:none;
    background:#ffe5e5;
    color:#b00020;
    padding:10px;
    border-radius:10px;
    margin:10px 0;
}

#adminPage{
    display:none;
}

.header{
    background:linear-gradient(135deg,#5a1235,#8d2855);
    color:white;
    padding:25px 18px;
    text-align:center;
}

.header h1{
    margin:0;
}

.container{
    max-width:750px;
    margin:auto;
    padding:20px;
}

.card{
    background:white;
    border-radius:18px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.card h2{
    color:#6b183f;
    margin-top:0;
}

.member{
    border:1px solid #eadde4;
    border-radius:14px;
    padding:15px;
    margin:12px 0;
    background:#fffafd;
}

.member h3{
    color:#6b183f;
    margin-top:0;
}

label{
    display:block;
    margin:10px 0 5px;
    font-weight:bold;
}

input,
textarea{
    width:100%;
    padding:12px;
    border:1px solid #d8c6d0;
    border-radius:10px;
    font-size:16px;
}

textarea{
    min-height:110px;
}

.success{
    display:none;
    background:#e7f7e9;
    color:#176b25;
    padding:12px;
    border-radius:10px;
    margin-bottom:15px;
    text-align:center;
    font-weight:bold;
}

.loading{
    text-align:center;
    padding:15px;
    color:#777;
}

.back{
    display:block;
    text-align:center;
    margin:20px 0;
    color:#6b183f;
    font-weight:bold;
    text-decoration:none;
}

.small-note{
    color:#777;
    font-size:14px;
}

@media(max-width:600px){

    .container{
        padding:12px;
    }

    .card{
        padding:15px;
    }

    .header h1{
        font-size:23px;
    }
}
</style>
</head>

<body>

<!-- =========================
     LOGIN
========================= -->

<div id="loginPage">

    <div class="login-box">

        <div class="login-icon">🔐</div>

        <h1>Admin Login</h1>

        <p>রঘুপুর সার্বজনীন পূজা মন্ডপ</p>

        <div id="loginError" class="login-error">
            ❌ Email অথবা Password ভুল।
        </div>

        <input
            type="email"
            id="email"
            placeholder="Admin Email"
            autocomplete="username"
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
            autocomplete="current-password"
        >

        <button class="login-btn" onclick="login()">
            🔓 Login
        </button>

    </div>

</div>


<!-- =========================
     ADMIN PAGE
========================= -->

<div id="adminPage">

    <div class="header">

        <h1>🔐 Admin Panel</h1>

        <p>ওয়েবসাইট পরিচালনা</p>

    </div>


    <div class="container">

        <div id="success" class="success">
            ✅ তথ্য সফলভাবে Save হয়েছে!
        </div>


        <!-- =====================
             COMMITTEE
        ====================== -->

        <div class="card">

            <h2>👥 পূজা কমিটি</h2>

            <p class="small-note">
                কমিটির সদস্যদের নাম ও ফোন নম্বর এখানে পরিবর্তন করতে পারবে।
            </p>

            <div id="members"></div>

            <button class="save" onclick="saveMembers()">
                💾 কমিটির তথ্য Save করুন
            </button>

        </div>


        <!-- =====================
             SCHEDULE
        ====================== -->

        <div class="card">

            <h2>📅 পূজার সময়সূচি</h2>

            <label>ষষ্ঠী</label>

            <input
                id="shasthi"
                placeholder="সন্ধ্যা ৭:০০ — বোধন"
            >

            <label>সপ্তমী</label>

            <input
                id="saptami"
                placeholder="সকাল ৮:০০ — পূজা"
            >

            <label>অষ্টমী</label>

            <input
                id="ashtami"
                placeholder="সকাল ১০:০০ — অঞ্জলি"
            >

            <label>নবমী</label>

            <input
                id="navami"
                placeholder="সন্ধ্যা ৭:০০ — আরতি"
            >

            <label>দশমী</label>

            <input
                id="dashami"
                placeholder="বিকাল ৪:০০ — বিসর্জন"
            >

            <button class="save" onclick="saveSchedule()">
                💾 সময়সূচি Save করুন
            </button>

        </div>


        <!-- =====================
             NOTICE
        ====================== -->

        <div class="card">

            <h2>📢 নোটিশ</h2>

            <label>নোটিশ</label>

            <textarea
                id="notice"
                placeholder="গুরুত্বপূর্ণ নোটিশ লিখুন..."
            ></textarea>

            <button class="save" onclick="saveNotice()">
                💾 নোটিশ Save করুন
            </button>

        </div>


        <!-- =====================
             CONTACT
        ====================== -->

        <div class="card">

            <h2>📞 যোগাযোগের তথ্য</h2>

            <label>গ্রাম</label>

            <input
                id="village"
                placeholder="গ্রামের নাম"
            >

            <label>উপজেলা</label>

            <input
                id="upazila"
                placeholder="উপজেলার নাম"
            >

            <label>জেলা</label>

            <input
                id="district"
                placeholder="জেলার নাম"
            >

            <label>ফোন নম্বর</label>

            <input
                id="contactPhone"
                type="tel"
                placeholder="01XXXXXXXXX"
            >

            <button class="save" onclick="saveContact()">
                💾 যোগাযোগের তথ্য Save করুন
            </button>

        </div>


        <a class="back" href="index.html">
            ← মূল ওয়েবসাইটে ফিরে যান
        </a>

        <button class="logout" onclick="logout()">
            🔒 Logout
        </button>

    </div>

</div>


<!-- =========================
     FIREBASE
========================= -->

<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getAuth,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
    getFirestore,
    doc,
    getDoc,
    setDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyCF2nRNM6yjW-1Mv910iW5pwoHkyBgWb-0",

    authDomain:
        "roghupurdurgapuja-b95f9.firebaseapp.com",

    projectId:
        "roghupurdurgapuja-b95f9",

    storageBucket:
        "roghupurdurgapuja-b95f9.firebasestorage.app",

    messagingSenderId:
        "763168095845",

    appId:
        "1:763168095845:web:4596d89deb42f52cb2108c",

    measurementId:
        "G-ZSE74K2D2Y"
};


/* =========================
   INITIALIZE
========================= */

const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);

const db =
    getFirestore(app);


/* =========================
   FIRESTORE DOCUMENT
========================= */

const siteRef =
    doc(db,"pujaData","site");


/* =========================
   POSITIONS
========================= */

const positions = [

    "সভাপতি",
    "সহ-সভাপতি ১",
    "সহ-সভাপতি ২",
    "সহ-সভাপতি ৩",
    "সাধারণ সম্পাদক",
    "সহ-সাধারণ সম্পাদক",
    "কোষাধ্যক্ষ",
    "সহ-কোষাধ্যক্ষ",
    "সাংগঠনিক সম্পাদক",
    "দপ্তর সম্পাদক",
    "প্রচার সম্পাদক",
    "গ্রন্থনা ও প্রকাশনা সম্পাদক",
    "সাংস্কৃতিক সম্পাদক",
    "মহিলা বিষয়ক সম্পাদক"

];


/* =========================
   CREATE MEMBER FORM
========================= */

const membersBox =
    document.getElementById("members");


positions.forEach(function(position,index){

    membersBox.innerHTML += `

        <div class="member">

            <h3>${position}</h3>

            <label>নাম</label>

            <input
                id="name${index}"
                placeholder="${position}-এর নাম"
            >

            <label>ফোন নম্বর</label>

            <input
                id="phone${index}"
                type="tel"
                placeholder="ফোন নম্বর"
            >

        </div>

    `;

});


for(let i=1;i<=16;i++){

    membersBox.innerHTML += `

        <div class="member">

            <h3>সদস্য ${i}</h3>

            <label>নাম</label>

            <input
                id="nameMember${i}"
                placeholder="সদস্য ${i}-এর নাম"
            >

            <label>ফোন নম্বর</label>

            <input
                id="phoneMember${i}"
                type="tel"
                placeholder="ফোন নম্বর"
            >

        </div>

    `;

}


/* =========================
   LOGIN
========================= */

window.login = async function(){

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    const errorBox =
        document.getElementById("loginError");


    errorBox.style.display="none";


    if(!email || !password){

        errorBox.textContent =
            "❌ Email এবং Password দিন।";

        errorBox.style.display="block";

        return;

    }


    try{

        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );

    }

    catch(error){

        console.error(error);

        errorBox.textContent =
            "❌ Email অথবা Password ভুল।";

        errorBox.style.display="block";

    }

};


/* =========================
   LOGOUT
========================= */

window.logout = async function(){

    await signOut(auth);

};


/* =========================
   AUTH STATE
========================= */

onAuthStateChanged(
    auth,
    async function(user){

        if(user){

            document.getElementById(
                "loginPage"
            ).style.display="none";

            document.getElementById(
                "adminPage"
            ).style.display="block";

            await loadData();

        }

        else{

            document.getElementById(
                "loginPage"
            ).style.display="flex";

            document.getElementById(
                "adminPage"
            ).style.display="none";

        }

    }
);


/* =========================
   LOAD DATA
========================= */

async function loadData(){

    try{

        const snapshot =
            await getDoc(siteRef);


        if(!snapshot.exists()){

            return;

        }


        const data =
            snapshot.data();


        /* MEMBERS */

        const members =
            data.members || {};


        positions.forEach(
            function(position,index){

                const member =
                    members[position] || {};


                document.getElementById(
                    "name"+index
                ).value =
                    member.name || "";


                document.getElementById(
                    "phone"+index
                ).value =
                    member.phone || "";

            }
        );


        for(let i=1;i<=16;i++){

            const member =
                members["সদস্য "+i] || {};


            document.getElementById(
                "nameMember"+i
            ).value =
                member.name || "";


            document.getElementById(
                "phoneMember"+i
            ).value =
                member.phone || "";

        }


        /* SCHEDULE */

        const schedule =
            data.schedule || {};


        document.getElementById(
            "shasthi"
        ).value =
            schedule.shasthi || "";


        document.getElementById(
            "saptami"
        ).value =
            schedule.saptami || "";


        document.getElementById(
            "ashtami"
        ).value =
            schedule.ashtami || "";


        document.getElementById(
            "navami"
        ).value =
            schedule.navami || "";


        document.getElementById(
            "dashami"
        ).value =
            schedule.dashami || "";


        /* NOTICE */

        document.getElementById(
            "notice"
        ).value =
            data.notice || "";


        /* CONTACT */

        const contact =
            data.contact || {};


        document.getElementById(
            "village"
        ).value =
            contact.village || "রঘুপুর";


        document.getElementById(
            "upazila"
        ).value =
            contact.upazila || "ওসমানীনগর";


        document.getElementById(
            "district"
        ).value =
            contact.district || "সিলেট";


        document.getElementById(
            "contactPhone"
        ).value =
            contact.phone || "01323688596";

    }

    catch(error){

        console.error(error);

        alert(
            "Firebase থেকে তথ্য Load করা যায়নি।"
        );

    }

}


/* =========================
   SAVE MEMBERS
========================= */

window.saveMembers = async function(){

    try{

        const snapshot =
            await getDoc(siteRef);


        const oldData =
            snapshot.exists()
                ? snapshot.data()
                : {};


        const members =
            oldData.members || {};


        positions.forEach(
            function(position,index){

                members[position] = {

                    name:
                        document.getElementById(
                            "name"+index
                        ).value.trim(),

                    phone:
                        document.getElementById(
                            "phone"+index
                        ).value.trim()

                };

            }
        );


        for(let i=1;i<=16;i++){

            members["সদস্য "+i] = {

                name:
                    document.getElementById(
                        "nameMember"+i
                    ).value.trim(),

                phone:
                    document.getElementById(
                        "phoneMember"+i
                    ).value.trim()

            };

        }


        await setDoc(
            siteRef,
            {
                members:members
            },
            {merge:true}
        );


        showSuccess();

    }

    catch(error){

        console.error(error);

        alert(
            "কমিটির তথ্য Save করা যায়নি।"
        );

    }

};


/* =========================
   SAVE SCHEDULE
========================= */

window.saveSchedule = async function(){

    const schedule = {

        shasthi:
            document.getElementById(
                "shasthi"
            ).value.trim(),

        saptami:
            document.getElementById(
                "saptami"
            ).value.trim(),

        ashtami:
            document.getElementById(
                "ashtami"
            ).value.trim(),

        navami:
            document.getElementById(
                "navami"
            ).value.trim(),

        dashami:
            document.getElementById(
                "dashami"
            ).value.trim()

    };


    try{

        await setDoc(
            siteRef,
            {
                schedule:schedule
            },
            {merge:true}
        );


        showSuccess();

    }

    catch(error){

        console.error(error);

        alert(
            "সময়সূচি Save করা যায়নি।"
        );

    }

};


/* =========================
   SAVE NOTICE
========================= */

window.saveNotice = async function(){

    const notice =
        document.getElementById(
            "notice"
        ).value.trim();


    try{

        await setDoc(
            siteRef,
            {
                notice:notice
            },
            {merge:true}
        );


        showSuccess();

    }

    catch(error){

        console.error(error);

        alert(
            "নোটিশ Save করা যায়নি।"
        );

    }

};


/* =========================
   SAVE CONTACT
========================= */

window.saveContact = async function(){

    const contact = {

        village:
            document.getElementById(
                "village"
            ).value.trim(),

        upazila:
            document.getElementById(
                "upazila"
            ).value.trim(),

        district:
            document.getElementById(
                "district"
            ).value.trim(),

        phone:
            document.getElementById(
                "contactPhone"
            ).value.trim()

    };


    try{

        await setDoc(
            siteRef,
            {
                contact:contact
            },
            {merge:true}
        );


        showSuccess();

    }

    catch(error){

        console.error(error);

        alert(
            "যোগাযোগের তথ্য Save করা যায়নি।"
        );

    }

};


/* =========================
   SUCCESS MESSAGE
========================= */

function showSuccess(){

    const box =
        document.getElementById(
            "success"
        );


    box.style.display="block";


    setTimeout(
        function(){

            box.style.display="none";

        },
        2500
    );

}

</script>

</body>
</html>
